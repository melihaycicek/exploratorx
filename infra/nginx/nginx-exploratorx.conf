# ──────────────────────────────────────────────────────────────────────────────
# ExploratorX — Nginx Security Config
#
# Bu dosya Audfix sunucusundaki Nginx konfigürasyonuna eklenmelidir.
# Audroad'ın kullandığı aynı auth_request pattern'ı kullanılır.
#
# demo.audfix.com/exploratorx → ExploratorX dashboard
#
# Audfix kendi /audfix/auth/verify endpoint'i üzerinden DB kontrolü yapar:
#   - 200 OK   → kullanıcı yetkili (guest veya admin), geçiş serbest
#   - 401      → yetkisiz, login'e yönlendir
# ──────────────────────────────────────────────────────────────────────────────

# ─── ExploratorX: API + WebSocket ─────────────────────────────────────────────

location /exploratorx/api/ws {
    # Auth kontrolü — Audfix DB'sini sorgular
    auth_request /audfix/auth/verify;
    error_page 401 = @exploratorx_auth_redirect;

    # WebSocket headers
    proxy_pass http://127.0.0.1:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /exploratorx/api/ {
    # Auth kontrolü
    auth_request /audfix/auth/verify;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    error_page 401 = @exploratorx_auth_redirect;

    # Kullanıcı bilgisini engine'e ilet
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Forwarded-User $auth_user;

    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;

    # Rate limiting (Audfix ile uyumlu)
    limit_req zone=api burst=20 nodelay;
}

location /exploratorx/actuator/ {
    # Actuator (Prometheus scrape) — sadece dahili erişim, auth YOK
    # Prometheus sunucusu internal network'ten erişir
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    deny all;

    proxy_pass http://127.0.0.1:8080/actuator/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /exploratorx/ {
    # Auth kontrolü
    auth_request /audfix/auth/verify;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    error_page 401 = @exploratorx_auth_redirect;

    # Next.js dashboard
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Auth-User $auth_user;

    # Cache: static assets yes, HTML no
    proxy_cache_bypass $http_pragma $http_cache_control;
    add_header X-Cache-Status $upstream_cache_status;
}

# ─── Auth redirect ─────────────────────────────────────────────────────────────

location @exploratorx_auth_redirect {
    # Audfix login sayfasına yönlendir
    # next parametresi ile başarılı login sonrası geri dön
    return 302 https://demo.audfix.com/login?next=/exploratorx/;
}

# ─── Security headers ─────────────────────────────────────────────────────────
# Bu headerlar tüm /exploratorx/ yanıtlarına eklenir

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
