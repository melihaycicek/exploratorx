# ──────────────────────────────────────────────────────────────────────────────
# ExploratorX — Grafana dashboard provisioning
# Loads JSON dashboards mounted at /var/lib/grafana/dashboards.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: 1

providers:
  - name: exploratorx
    orgId: 1
    folder: ExploratorX
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
